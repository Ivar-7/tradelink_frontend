<!-- Background Layer (Blurred Category Page Content) -->
<div class="fixed inset-0 z-0 blur-xl scale-105 opacity-60">

<header class="bg-white/80 fixed top-0 w-full flex justify-between items-center px-12 py-4">
<span class="text-2xl font-bold tracking-tighter text-slate-900">TradeLink</span>
<div class="flex gap-8 text-slate-500 font-medium">
<span>Shop</span><span>Categories</span><span>Deals</span>
</div>

<main class="pt-24 px-12 grid grid-cols-4 gap-8">
<div class="col-span-1 h-screen bg-surface-container-low rounded-xl"></div>
<div class="col-span-3 grid grid-cols-3 gap-6">

</div>

<div class="fixed inset-0 bg-on-surface/40 backdrop-blur-sm z-40"></div>

<h1 class="text-3xl font-black tracking-tight text-on-surface">Filter</h1>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant group">
<span class="material-symbols-outlined text-2xl group-active:scale-90 transition-transform" data-icon="close">close</span>
</button>
</header>
<!-- Content Area -->
<div class="flex-1 overflow-y-auto px-10 py-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-12">

<div class="space-y-6">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Price Range</label>
<div class="relative h-1 w-full bg-surface-container-highest rounded-full mt-8">
<div class="absolute h-full bg-primary left-1/4 right-1/4 rounded-full"></div>
<div class="absolute -top-2 left-1/4 w-5 h-5 bg-primary border-4 border-surface-container-lowest rounded-full shadow-md cursor-pointer"></div>

<span class="text-[10px] font-bold text-outline uppercase block mb-1">Min Price</span>

<span class="text-on-surface-variant mr-2">$</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-sm" type="text" value="500"/>

</div>
</div>
</div>
</div>

<label class="flex items-center group cursor-pointer">

<span class="ml-4 text-sm font-medium text-on-surface group-hover:text-primary transition-colors">Dell</span>

</div>
</div>

<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant">Availability</label>

<button aria-checked="true" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary" role="switch">

</div>
</div>

<button class="text-xs font-black uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors py-2">

<div class="flex gap-4">
<button class="px-8 py-4 bg-primary text-on-primary font-bold rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all">
                        Apply Filters

</div>
</footer>
</section>
</div>

<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[60] pointer-events-none opacity-20">
