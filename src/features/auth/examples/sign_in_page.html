<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 40px 80px -20px rgba(27, 27, 27, 0.04);
        }

            background: rgba(249, 249, 249, 0.8);
            backdrop-filter: blur(20px);
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopNavBar (Shared Component Template) -->
<!-- Suppressed on Login/Transactional Pages as per Hierarchy Rules -->
<main class="flex-grow flex items-center justify-center px-6 py-20 relative overflow-hidden">
<!-- Background decorative element for "Deep Tech" aesthetic -->
<div class="absolute top-[-10%] right-[-5%] w-[40rem] h-[40rem] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30rem] h-[30rem] rounded-full bg-secondary/5 blur-[100px]"></div>
<!-- Auth Card Container -->
<div class="w-full max-w-md z-10">
<!-- Brand Anchor -->
<div class="mb-12 text-center">
<h1 class="text-3xl font-extrabold tracking-tighter text-on-surface">TradeLink</h1>
</div>
<!-- Sign In Card -->
<div class="bg-surface-container-lowest ambient-shadow p-10 md:p-14 rounded-lg">
<div class="mb-10 text-center">
<h2 class="text-2xl font-bold tracking-tight text-on-surface mb-2">Sign In</h2>
<p class="text-on-surface-variant text-sm font-medium">Access your global trading dashboard</p>
</div>
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 p-4 rounded-md text-on-surface placeholder:text-outline placeholder:font-medium" placeholder="Email Address" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-widest font-bold text-on-surface-variant ml-1">Password</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-300 p-4 rounded-md text-on-surface placeholder:text-outline placeholder:font-medium pr-12" placeholder="Password" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center group cursor-pointer">
<input class="w-4 h-4 rounded-sm border-none bg-surface-container-high text-primary focus:ring-primary/20 transition-all" type="checkbox"/>
<span class="ml-2 text-xs font-semibold text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-xs font-bold text-primary hover:underline underline-offset-4 decoration-2 transition-all" href="#">Forgot Password?</a>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-md hover:opacity-90 active:scale-[0.98] transition-all duration-200 tracking-tight">
                        Sign In
                    </button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant opacity-20"></div>
<span class="flex-shrink mx-4 text-[10px] font-bold uppercase tracking-widest text-outline">or</span>
<div class="flex-grow border-t border-outline-variant opacity-20"></div>
</div>
<!-- Secondary Action -->
<button class="w-full py-4 bg-surface-container-highest text-on-surface font-bold rounded-md hover:bg-surface-variant active:scale-[0.98] transition-all duration-200 tracking-tight">
                        Create an Account
                    </button>
</form>
</div>
<!-- Footer Meta -->
<div class="mt-8 text-center space-y-4">
<p class="text-[10px] uppercase tracking-widest font-bold text-outline">Trusted by 50,000+ traders globally</p>
<div class="flex justify-center gap-6">
<img class="h-4 opacity-30 grayscale hover:grayscale-0 transition-all duration-300" data-alt="Trusted partner tech company logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_ndpwStcMBg2DOv-jF9hzmcOdkTfaz6OZYOt9hic4KfEIE5IPDlyV9EpnE6JjHgrJ7Q9z-NxdM1PFP5BrfGUCD5BrMWw4u9hxK3BwNbrrMwLN_9pysf-Zz6oS9BwSKV7UA-_wOqidn9d86aj2JsrwyCq4EFl-r4MBlZszuGV9TOh9gj4mCebzbIyzZ77cgnlt8ndVgXtosdaH1uLJOj7KWR_2IWw8_MejPDROEoBUELe6_e7y4Pk0sq_6gkiJ1jx-S8wthRgf-NI"/>

</div>
</div>
</div>
</main>
<!-- Footer (Shared Component Template) -->
<footer class="bg-surface-container-low py-16 flex flex-col items-center justify-center gap-4 w-full">
<div class="text-on-surface font-bold text-lg mb-2">TradeLink</div>
<div class="flex gap-8 mb-4">
<a class="text-[10px] font-medium uppercase tracking-widest text-on-surface-variant hover:text-on-surface transition-all" href="#">Privacy Policy</a>
