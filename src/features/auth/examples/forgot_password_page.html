<main class="flex-grow flex items-center justify-center px-4 pt-32 pb-20">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl p-10 ambient-shadow">

<div class="text-center mb-10">
<h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-3 font-headline">Reset Password</h1>
<p class="text-on-surface-variant text-sm leading-relaxed font-body">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form -->
<form action="#" class="space-y-6">
<div class="space-y-2">
<label class="block text-[10px] font-bold tracking-widest uppercase text-on-surface-variant/70 ml-1" for="email">

                    </label>
<input class="w-full px-4 py-4 bg-surface-container-high rounded-lg border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline/50" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-lg transition-transform active:scale-[0.98] duration-200 shadow-lg shadow-primary/10" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Card Footer -->
<div class="mt-10 pt-8 border-t border-outline-variant/10 text-center">
<a class="inline-flex items-center gap-2 text-primary hover:text-primary-container font-semibold text-sm transition-colors group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>

                </a>
</div>
</div>
